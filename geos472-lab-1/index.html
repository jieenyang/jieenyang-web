<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Klamath National Forest prescribed fire treatments</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    #map { position: absolute; inset: 0; }
    #panel {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(255,255,255,0.92); padding: 10px 14px;
      border-radius: 4px; box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      max-width: 260px; font-size: 13px; line-height: 1.4;
    }
    #panel h1 { font-size: 16px; margin: 0 0 4px; }
    #panel .sub { color: #555; margin-bottom: 8px; }
    #panel .row { display: flex; align-items: center; margin: 3px 0; }
    #panel .swatch { width: 16px; height: 16px; margin-right: 8px; border: 1px solid rgba(0,0,0,0.3); }
    #panel .src { color: #777; font-size: 11px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Prescribed fire on the Klamath National Forest</h1>
    <div class="sub">Fuel treatment polygons by burn type</div>
    <div class="row"><span class="swatch" style="background:#d7301f"></span>Broadcast burn</div>
    <div class="row"><span class="swatch" style="background:#6a3d9a"></span>Jackpot burn</div>
    <div class="row"><span class="swatch" style="background:#1f78b4"></span>Machine pile burn</div>
    <div class="src">Data: CAL FIRE fuel treatment polygons, clipped to the Klamath National Forest boundary (USFS).</div>
  </div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'klamath_rx_treatment_style.json',
      center: [-123.0, 41.75],
      zoom: 9
    });
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
