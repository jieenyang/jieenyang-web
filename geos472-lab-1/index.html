<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Klamath National Forest prescribed fire treatments</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
    #map canvas.p5Canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    
    const map = new maplibregl.Map({
      container: 'map',
      style: 'klamath_rx_treatment_style.json',
      center: [-122.5, 41.5],
      zoom: 8
    });

    // When a treatment polygon is clicked, MapLibre runs onEachTreatment:

    function onEachTreatment(e) {
      const treatment = e.features[0].properties;
      const popup = new maplibregl.Popup();
      popup.setLngLat(e.lngLat);
      popup.setText(treatment.Treatment_Type + ', ' + treatment.YEAR);
      popup.addTo(map);
    }
    
    map.on('click', 'rx_treatments_layer_1', onEachTreatment);

    // Drawing a p5.js canvas that contains the legend:
    
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('map');
      noLoop();
    }
    
    function drawLegend() {
      
    // legend
    const x = 10, y = 10;
    const legendWidth = 230, legendHeight = 130;
    noStroke();
    fill(255, 255, 255, 220);
    rect(x, y, legendWidth, legendHeight, 5);

    // title font
    fill(20);
    textSize(13);
    textStyle(BOLD);
    text("Fuel Reduction Projects in the Klamath National Forest, CA", x + 10, y + 8, legendWidth - 20, 40);
    textStyle(NORMAL);

    // text font
    textSize(12);
    fill(70);
    text("Fuel treatment type:", x + 10, y + 55);

    // treatment type arrays
    const treatment_rows = [
      ["Broadcast Burn", 215, 48, 31],
      ["Jackpot Burn", 106, 61, 154],
      ["Machine Pile Burn", 31, 120, 180]
    ];
  
    let row_y_position = y + 65;
    for (const [label, r, g, b] of treatment_rows) {
      noStroke();
      fill(r, g, b);
      rect(x + 10, row_y_position, 14, 14, 2);
      fill(20);
      textSize(12);
      text(label, x + 30, row_y_position + 13);
      row_y_position = row_y_position + 20;
    }
      
    }
    function draw() {
      clear();
      drawLegend();
    }
    
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      redraw();
    }
    
    map.addControl(new maplibregl.NavigationControl());
    
  </script>
</body>
</html>
