<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Klamath National Forest prescribed fire treatments</title>
  <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <style>
    body { margin: 0; }
    #map { position: absolute; inset: 0; }
    #map canvas.p5Canvas { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 1; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = new maplibregl.Map({
      container: 'map',
      style: 'klamath_rx_treatment_style.json',
      center: [-122.5, 41.5],
      zoom: 8
    });
    function setup() {
      const canvas = createCanvas(windowWidth, windowHeight);
      canvas.parent('map');
      noLoop();
    }
    function drawLegend() {
      const x = 10, y = 10
      noStroke();
      fill(255, 255, 255, 200);
      rect(x, y, 250, 100, 5);
      fill(30);
      textSize(12);
      text("Fuel Reduction Projects in the Klamath National Forest, CA", x + 3, y + 3);
      
    }
    function draw() {
      clear();
      drawLegend();
    }
    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
      redraw();
    }
    map.addControl(new maplibregl.NavigationControl());
  </script>
</body>
</html>
