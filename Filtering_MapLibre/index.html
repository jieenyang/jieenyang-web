<!DOCTYPE html>
<html>

  <head>
    
    <meta charset="utf-8" />
    <title>UBC Building Entrances</title>

    <!-- Load MapLibre's stylesheet (CSS). Its code (JavaScript) is loaded below, in the script. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.css"
    />

    <!-- Allow the map size adjust based on browser window. -->
    <style>
      html { height: 100%; }
      body { margin: 0; height: 100%; }
      #mapid { width: 100%; height: calc(100% - 50px); }
    </style>
    
  </head>
  
  <body>
    <!-- The web map will go in this div element. -->
    <div id="mapid"></div>

    <div id="controls" style="margin: 15px;">
      <button id="showAllEntrancesButton">Reset All Entrances</button>
      <span style="display: inline-block; width: 30px;"></span>
      <input type="text" id="highlightEntrancesTextEntry" placeholder="e.g. Main">
      <button id="highlightEntrancesButton">Highlight</button>
    </div>

    <script type="module">
      // Load MapLibre's code (JavaScript). Version 6 is loaded as a module, with import.
      import * as maplibregl from 'https://cdn.jsdelivr.net/npm/maplibre-gl@6.15.0/dist/maplibre-gl.mjs';

      // Make a map with new maplibregl.Map(), and keep it in the variable map.
      const map = new maplibregl.Map({
        container: 'mapid',                  // the id of the div above
        center: [-123.256113, 49.265637],    // [longitude, latitude]
        zoom: 15,
        style: 'https://tiles.openfreemap.org/styles/positron'   // a ready-made style from OpenFreeMap
      });

      // A module keeps its names to itself. This line lets you type map in the browser's console.
      window.map = map;

      // The raw URL of the UBC building entrance file on GitHub.
      const url = 'https://raw.githubusercontent.com/UBCGeodata/ubc-geospatial-opendata/master/ubcv/locations/geojson/ubcv_building_entraces.geojson';

      const url2 = 'https://raw.githubusercontent.com/UBCGeodata/ubc-geospatial-opendata/master/ubcv/locations/geojson/ubcv_buildings.geojson';
      
      // Paint properties set how the layer draws each circle.
      // They are kept in a variable, EntrancePaint, as they will be in next Tuesday's sketches.
      
      const EntrancePaint = {
        'circle-radius': ['interpolate', ['linear'], ['zoom'], 12, 1, 19, 8],
        // A zoom expression: the radius depends on the map's zoom (as in step 8).

        'circle-color': ['match', ['get', 'ENTRANCE_TYPE'],
                         'Main', '#008000',
                         'Secondary', '#FFFF00',
                         'Tertiary', '#FFA500',
                         'Exit', '#FF0000',
                         '#999999'],
        // A data-driven expression: the colour depends on each entrance's ENTRANCE_TYPE value.
        // 'Main' gives green. 'Secondary' gives yellow. 'Tertiary' gives orange. 'Exit' gives red.
        // Any other value, or no value, gives grey.

        'circle-opacity': 0.50
      };

      const BuildingPaint = {
        'fill-color': '#Add8e6',
        'fill-opacity': 0.50
      };
      
      function onEachPoint(e) {
      // When someone clicks an entrance on the map, MapLibre runs this function.
      // e holds information about the click. e.features[0] is the feature (the entrance) that was clicked.

        const entrance = e.features[0].properties;
        // entrance holds that feature's attributes, such as ENTRANCE_TYPE.

        if (entrance.ENTRANCE_TYPE) {
          const popup = new maplibregl.Popup();
          popup.setLngLat(e.lngLat);
          popup.setText(entrance.ENTRANCE_TYPE + ' doorway, ' + entrance.NUM_DOORS + ' door(s)');
          popup.addTo(map);
        }
        // Does this entrance have a type? If it does not, no popup opens.
        
      }

      function addEntrances() {
        
        if (map.getSource('entrances')) {
          return;   // don't add entrances twice
        }
        // If the entrances are already on the map, stop here.
        // MapLibre cannot add a second source with the same name.
        
        map.addSource('entrances', {
          type: 'geojson',
          data: url,
          attribution: 'UBC Building Entrances, UBCGeodata'
        });
        
        map.addLayer({
          id: 'entrance-circles',
          type: 'circle',
          source: 'entrances',
          paint: EntrancePaint
        });
        
        map.on('click', 'entrance-circles', onEachPoint);
        
      }

      function showAllEntrances() {
        addEntrances();
        map.setFilter('entrance-circles', null);
      }
      
      function highlightEntrances() {
        addEntrances();
        const textEntry = document.getElementById('highlightEntrancesTextEntry');
        const entranceTypeToHighlight = textEntry.value;
        // .value refers to the text in the box when the button is clicked.
        if (entranceTypeToHighlight === '') {
          showAllEntrances();
        return;
        }
        map.setFilter('entrance-circles', ['in', entranceTypeToHighlight, ['get', 'ENTRANCE_TYPE']]);
      }

      map.on('load', function () {
        // Adding the sources and layers to the map when it opens, but only after the map's style has loaded.
        // The layers only get added when the whole file has loaded from the source link.
        
        map.addSource('buildings', {
          type: 'geojson',
          data: url2,
          attribution: 'UBC Buildings, UBCGeodata'
        });
        
        map.addLayer({
          id: 'building-polygons',
          type: 'fill',
          source: 'buildings',
          paint: BuildingPaint
        });

        addEntrances();

        const button = document.getElementById('showAllEntrancesButton');
        button.addEventListener('click', showAllEntrances);

        const highlightButton = document.getElementById('highlightEntrancesButton');
        highlightButton.addEventListener('click', highlightEntrances);
      });
      
    </script>
  </body>
</html>
